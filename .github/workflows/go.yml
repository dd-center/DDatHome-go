name: Go
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race -count=1 -timeout=120s ./...
      - name: Accelerated recovery test
        if: runner.os == 'Linux'
        env:
          DDATHOME_SOAK: 2m
        run: go test -race -run '^TestFaultSoak$' -count=1 -timeout=3m -v

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - run: sh tools/build.sh
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: DDatHome-go
          path: dist/
          if-no-files-found: error

  docker:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker build -t ddathome-go:test .
      - name: Binary and persistent identity
        run: |
          docker run --rm ddathome-go:test --version
          docker volume create ddathome-test
          docker run --rm -v ddathome-test:/data ddathome-go:test --check-config > first.txt
          docker run --rm -v ddathome-test:/data ddathome-go:test --check-config > second.txt
          diff first.txt second.txt
          docker volume rm ddathome-test
